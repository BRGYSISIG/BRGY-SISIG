function renderModal(root){
  const m=UI.modal;if(!m)return;
  const ov=el('div','ov');ov.onclick=function(e){if(e.target===ov){UI.modal=null;render();}};
  const box=el('div','modal');
  function close(){UI.modal=null;render();}
  /* v7.7.1: one place to run a write, so no call site can forget the three
     things they kept forgetting - disable the button, check the result, say
     something when it fails. `busy` is held on the modal box itself, which is
     thrown away on close, so it cannot leak into the next modal. */
  async function runWrite(label,fn){
    if(box.dataset.busy==='1')return false;
    box.dataset.busy='1';
    const btns=box.querySelectorAll('button');
    for(let i=0;i<btns.length;i++){btns[i].disabled=true;btns[i].style.opacity='0.55';}
    let r=null;
    try{r=await fn();}catch(e){console.error(label,e);r=null;}
    if(r===null||r===false){
      box.dataset.busy='0';
      for(let i=0;i<btns.length;i++){btns[i].disabled=false;btns[i].style.opacity='';}
      alert(label+' failed.\n\nNothing was saved. This is usually a lost '
        +'connection or a row-level-security policy refusing the write. '
        +'Check the browser console for the exact error.');
      return false;
    }
    UI.modal=null;
    await loadData();
    return true;
  }
  function save(table,payload,id){
    runWrite('Save',function(){
      return id
        ?api('/rest/v1/'+table+'?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload)})
        :api('/rest/v1/'+table,{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload)});
    });
  }
  function gv(id){return(document.getElementById(id)||{}).value||'';}

  if(m.type==='emp'){
    const it=m.item||{};const isNew=!m.item;
    box.appendChild(el('div','modal-title',isNew?'Add employee':'Edit employee'));
    mfField(box,'eName','Full name','text',it.name,'Employee name');
    mfField(box,'eRole','Role','select',it.role||'Staff','',[ {v:'Staff',l:'Staff'},{v:'Cashier',l:'Cashier'},{v:'Manager',l:'Manager'},{v:'Supervisor',l:'Supervisor'},{v:'Cook',l:'Cook'},{v:'Driver',l:'Driver'}]);
    mfField(box,'ePhone','Phone','text',it.phone,'');
    mfField(box,'ePayType','Pay type','select',it.pay_type||'daily','',[ {v:'hourly',l:'Hourly rate'},{v:'daily',l:'Daily rate'},{v:'monthly',l:'Monthly salary'},{v:'commission',l:'Commission (% of sales)'}]);
    mfField(box,'eRate','Rate (PHP or % for commission)','number',it.pay_type==='commission'?it.commission_pct:it.rate,'0');
    modalBtns(box,close,function(){
      const pt=gv('ePayType'),rate=parseFloat(gv('eRate'))||0;
      const p={biz_id:SESSION.bizId,name:gv('eName'),role:gv('eRole')||'Staff',phone:gv('ePhone'),pay_type:pt,rate:pt==='commission'?0:rate,commission_pct:pt==='commission'?rate:0,active:true};
      if(!p.name){alert('Enter name');return;}
      save('employees',p,it.id);
    /* close() used to sit outside the uiConfirm callback, so the edit modal
       vanished before the user had answered — and it vanished whether they
       confirmed or cancelled. */
    },isNew?'Add':'Save',it.id?function(){uiConfirm('Remove '+it.name+'?',async function(__ok){
      if(!__ok){close();return;}
      /* v7.7.1: the result of this PATCH was never read. The modal closed and
         the list reloaded either way, so an employee refused by RLS looked
         removed until the next page load brought them back. */
      await runWrite('Remove employee',function(){
        return api('/rest/v1/employees?id=eq.'+it.id,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify({active:false})});
      });
    },{tone:'dang'});}:null);

  } else if(m.type==='empAtt'){
    const e=m.item;
    box.appendChild(el('div','modal-title',e.name+' — Attendance'));
    const att=D.attendance.filter(function(a){return a.employee_id===e.id;})
      .sort(function(a,b){return new Date(b.time_in)-new Date(a.time_in);});
    // Summary stats
    const totalDays=new Set(att.map(function(a){return a.date;})).size;

function exportCSV(sales){
  const rows=[['ID','Date','Time','Cashier','Items','Total','Method','Ref','Voided']];
  sales.forEach(function(s){rows.push([s.txn_id,new Date(s.date).toLocaleDateString('en-PH'),ft(s.date),s.cashier||'',(s.items||[]).map(function(i){return i.name+' x'+(i.qty||1);}).join('; '),s.total.toFixed(2),s.method,s.ref||'',s.voided?'YES':'NO']);});
  const csv=rows.map(function(r){return r.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='sales-'+new Date().toISOString().slice(0,10)+'.csv';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}

// ── DASHBOARD TOKEN REFRESH ──
async function refreshDashSession(){
  const stored=JSON.parse(localStorage.getItem('apos_dash')||'{}');
  const refreshToken=stored.refresh||SESSION.refresh;
  if(!refreshToken)return false;
  try{
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:refreshToken})
    });
    const res=await r.json();
    if(res.access_token){
      SESSION.token=res.access_token;
      if(res.refresh_token)SESSION.refresh=res.refresh_token;
      saveSession();
      console.log('[ArroyoDash] Token refreshed OK');
      return true;
    }
    return false;
  }catch(e){return false;}
}

async function ensureDashAuth(){
  if(!SESSION.token)return false;
  try{
    const r=await fetch(SB_URL+'/auth/v1/user',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SESSION.token}});
    if(r.ok)return true;
    if(r.status===401||r.status===403){
      console.log('[ArroyoDash] Token expired — attempting refresh...');
      return await refreshDashSession();
    }
  }catch(e){}
  return true; // network error — let next call fail naturally
}

function scheduleDashTokenRefresh(){
  if(!SESSION.token)return;
  try{
    const payload=JSON.parse(atob(SESSION.token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    if(!payload.exp)return;
    const msUntilExpiry=(payload.exp*1000)-Date.now();
    const refreshIn=Math.max(0,msUntilExpiry-5*60*1000);
    console.log('[ArroyoDash] Token refresh in '+(refreshIn/1000/60).toFixed(1)+'m');
    setTimeout(async function(){
      if(!SESSION.token)return;
      const ok=await refreshDashSession();
      if(ok){scheduleDashTokenRefresh();}
      else{console.warn('[ArroyoDash] Proactive refresh failed');}
    },refreshIn);
  }catch(e){}
}

/* The single api() for the whole dashboard. Retries once on 401/403 after a
   token refresh, so an expired session recovers without a re-login. */
async function api(path,opts){
  const authToken=(SESSION&&SESSION.token)?SESSION.token:SB_KEY;
  const h={'apikey':SB_KEY,'Authorization':'Bearer '+authToken,'Content-Type':'application/json',...(opts&&opts.headers||{})};
  try{
    const r=await fetch(SB_URL+path,{...opts,headers:h});
    if(r.status===401||r.status===403){
      // Try refresh once, then retry
      const refreshed=await refreshDashSession();
      if(refreshed){
        const h2={'apikey':SB_KEY,'Authorization':'Bearer '+SESSION.token,'Content-Type':'application/json',...(opts&&opts.headers||{})};
        const r2=await fetch(SB_URL+path,{...opts,headers:h2});
        if(!r2.ok){console.error('API error after refresh',r2.status);return null;}
        if(r2.status===204||r2.status===205)return true;
        const t2=await r2.text();return t2?JSON.parse(t2):true;
      }
      console.error('API 401/403 and refresh failed for',path);return null;
    }
    if(!r.ok){const errText=await r.text();console.error('API error',r.status,errText);return null;}
    if(r.status===204||r.status===205){return true;}
    const t=await r.text();return t?JSON.parse(t):true;
  }catch(e){console.error('API fetch error',e);return null;}
}

// ── DASHBOARD SYNC STATUS in sidebar ──
let _dashSyncStatus='idle'; // 'idle' | 'syncing' | 'error' | 'offline'
function updateSyncStatus(status,msg){
  _dashSyncStatus=status;
  const dot=document.getElementById('dashSyncDot');
  const lbl=document.getElementById('dashSyncLbl');
  if(!dot||!lbl)return;
  const colors={idle:'var(--st)',syncing:'var(--ac)',error:'var(--dt)',offline:'var(--wt)'};
  const labels={idle:msg||'Synced',syncing:'Syncing…',error:msg||'Sync error',offline:'Offline'};
  dot.style.background=colors[status]||'var(--t3)';
  lbl.textContent=labels[status]||msg||'';
}

/* ==================================================================== *
 * v7.7.1 — AUTO REFRESH
 * The Dashboard only ever refetched on a manual Sync or a page load, so a
 * manager watching it during service saw figures frozen at whenever they last
 * pressed the button. loadData() already debounces itself (1.5s) and skips
 * while busy, so a poll is safe. Paused while the tab is hidden and while a
 * modal is open, so nothing moves under someone's hands mid-edit.
 * ==================================================================== */
setInterval(function(){
  if(!SESSION.token||!SESSION.bizId)return;
  if(document.hidden)return;
  if(UI.modal)return;
  if(!navigator.onLine)return;
  loadData();
},60000);

document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  if(!SESSION.token||!SESSION.bizId||UI.modal)return;
  loadData();
});

/* Abandoned drawers, same rule the POS applies: the database closes a shift
   and its clock-in when the till never did. Asked for once per load. */
(function(){
  if(!SESSION.token||!SESSION.bizId)return;
  setTimeout(async function(){
    try{
      await api('/rest/v1/rpc/arroyo_autoclose_stale_shifts',
        {method:'POST',body:JSON.stringify({p_hours:16})});
    }catch(e){}
  },8000);
})();

// ── ONLINE / OFFLINE HANDLING (dashboard) ──
window.addEventListener('offline',function(){
  updateSyncStatus('offline');
  console.log('[ArroyoDash] Went offline');
});

window.addEventListener('online',async function(){
  console.log('[ArroyoDash] Back online — reloading data');
  updateSyncStatus('syncing');
  const authed=await ensureDashAuth();
  if(authed){await loadData();}
  else{updateSyncStatus('error','Session expired — please sign in again');}
});

// Apply any pending dashboard update downloaded by POS applyUpdate()
try{
  const pending=localStorage.getItem('arroyo_dash_update');
  if(pending){localStorage.removeItem('arroyo_dash_update');document.open('text/html');document.write(pending);document.close();}
  else if(loadSession()){
  (async function(){
    try{
      // Refresh token on every dashboard open — no logout needed
      await ensureDashAuth();
      scheduleDashTokenRefresh();
      const headers={'apikey':SB_KEY,'Authorization':'Bearer '+SESSION.token,'Content-Type':'application/json'};
      // STEP 1: Try to read the POS session from localStorage - this is the authoritative bizId
      let posBizId=null;
      try{
        const posCloud=JSON.parse(localStorage.getItem((typeof DASH_PREFILL!=='undefined'&&DASH_PREFILL.bizId)?('arroyo_cloud_'+DASH_PREFILL.bizId):'arroyo_cloud')||'{}');
        if(posCloud&&posCloud.bizId)posBizId=posCloud.bizId;
        console.log('[ArroyoDash] POS bizId from localStorage:',posBizId);
      }catch(e){}
      // STEP 2: Get all businesses for this user
      const r=await fetch(SB_URL+'/rest/v1/businesses?user_id=eq.'+SESSION.user+'&order=created_at.asc',{headers});
      if(r.ok){
        const bizList=await r.json();
        console.log('[ArroyoDash] Businesses found:',bizList&&bizList.length);
        if(bizList&&bizList.length>0){
          /* v7.11.0 FIX: prefer the shop this dashboard was generated for. */
          const _pf2b=(typeof DASH_PREFILL!=='undefined'&&DASH_PREFILL.bizId)?DASH_PREFILL.bizId:'';
          let correctBiz=_pf2b?(bizList.find(function(b){return b.id===_pf2b;})||null):bizList[0];
          if(_pf2b&&!correctBiz)console.error('[ArroyoDash] bizId '+_pf2b+' not visible to this account.');
          // Priority 1: Use the bizId that matches the POS session
          if(posBizId){
            const match=bizList.find(function(b){return b.id===posBizId;});
            if(match){correctBiz=match;console.log('[ArroyoDash] Matched POS bizId:',correctBiz.id);}
          }
          // Priority 2: Pick the biz with the most data (sales OR employees)
          if(!_pf2b&&!posBizId&&bizList.length>1){
            let bestScore=0;
            for(const b of bizList){
              let score=0;
              const sr=await fetch(SB_URL+'/rest/v1/sales?biz_id=eq.'+b.id+'&limit=1',{headers});
              if(sr.ok){const sd=await sr.json();if(sd&&sd.length>0)score+=10;}
              const er=await fetch(SB_URL+'/rest/v1/employees?biz_id=eq.'+b.id+'&limit=1',{headers});
              if(er.ok){const ed=await er.json();if(ed&&ed.length>0)score+=5;}
              if(score>bestScore){bestScore=score;correctBiz=b;}
            }
            console.log('[ArroyoDash] Best biz by data score:',correctBiz.id,correctBiz.name);
          }
          if(correctBiz&&SESSION.bizId!==correctBiz.id){
            console.log('[ArroyoDash] BizId corrected:',SESSION.bizId,'&rarr;',correctBiz.id);
            /* v7.7.1 FIX: this used to PATCH every employees row from one
               biz_id to another, silently, at sign-in, with no confirmation
               and no way back. It moved only employees - sales, products,
               attendance and shifts stayed behind - so the effect was to split
               one business across two ids and make every total wrong in a
               different way.

               It existed to paper over the real fault: an owner ending up with
               two rows in `businesses`, because the POS creates a second one
               when claiming the seeded row fails, while my_biz_id() picked one
               of them with an unordered LIMIT 1 and the Dashboard picked the
               other. The v7.7.1 script fixes that properly - my_biz_id() is
               deterministic and the RLS policies accept every business the
               owner holds. Nothing is moved here now; if there really are two,
               say so and let a human decide which is real. */
            if(SESSION.bizId&&SESSION.bizId!==correctBiz.id){
              console.warn('[ArroyoDash] Two business rows for this owner: '
                +SESSION.bizId+' and '+correctBiz.id
                +'. No data has been moved. Decide which one is real before '
                +'trusting any total.');
            }
            if(correctBiz){SESSION.bizId=correctBiz.id;SESSION.bizName=correctBiz.name;saveSession();}
          }
        }
      }
    }catch(e){console.warn('[ArroyoDash] BizId check failed:',e);}
    loadData();
  })();
  }else{render();}
}catch(e){render();}
</script>

/* ==================================================================== *
 * In-app dialogs. Replaces window.alert / confirm / prompt, which the
 * browser renders as an OS box titled with the GitHub Pages hostname —
 * it looks like a security warning rather than part of the app.
 *
 * alert() is overridden directly since nothing depends on its return.
 * confirm()/prompt() return synchronously, so they cannot be overridden
 * safely; call sites use uiConfirm/uiPrompt with a callback instead.
 * ==================================================================== */
(function(){
  'use strict';
  var ov=document.getElementById('uid-ov'), box=document.getElementById('uid-box');
  var ic=document.getElementById('uid-ic'), ttl=document.getElementById('uid-t');
  var msg=document.getElementById('uid-m'), inWrap=document.getElementById('uid-in-wrap');
  var input=document.getElementById('uid-input'), err=document.getElementById('uid-err');
  var bNo=document.getElementById('uid-no'), bYes=document.getElementById('uid-yes');
  var queue=[], active=null, lastFocus=null;

  var ICONS={info:'i',warn:'!',dang:'!',ok:'\u2713'};

  function splitTitle(text){
    var t=String(text==null?'':text);
    var nl=t.indexOf('\n');
    if(nl>0&&nl<=64)return{title:t.slice(0,nl).trim(),body:t.slice(nl+1).trim()};
    if(t.length<=52)return{title:t.trim(),body:''};
    var dot=t.search(/[.?!]\s/);
    if(dot>0&&dot<=64)return{title:t.slice(0,dot+1).trim(),body:t.slice(dot+2).trim()};
    return{title:'',body:t.trim()};
  }

  function show(cfg){
    if(active){queue.push(cfg);return;}
    active=cfg;
    lastFocus=document.activeElement;
    var st=splitTitle(cfg.text);
    var tone=cfg.tone||'info';
    ic.className=tone; ic.textContent=ICONS[tone]||'i';
    ttl.textContent=cfg.title||st.title||(cfg.kind==='confirm'?'Please confirm':'Notice');
    msg.textContent=cfg.title?cfg.text:(st.body||st.title);
    msg.style.display=msg.textContent?'block':'none';
    err.classList.remove('on'); err.textContent='';
    if(cfg.kind==='prompt'){
      inWrap.classList.add('on');
      input.type=cfg.password?'password':'text';
      input.value=cfg.value||'';
      input.placeholder=cfg.placeholder||'';
    } else inWrap.classList.remove('on');
    bNo.style.display=(cfg.kind==='alert')?'none':'';
    bNo.textContent=cfg.cancelText||'Cancel';
    bYes.textContent=cfg.okText||(cfg.kind==='alert'?'OK':'Confirm');
    bYes.className=(tone==='dang')?'uid-dang':'uid-pri';
    ov.classList.add('on');
    setTimeout(function(){ (cfg.kind==='prompt'?input:bYes).focus(); },40);
  }

  function done(result){
    if(!active)return;
    var cb=active.cb; active=null;
    ov.classList.remove('on');
    try{ if(lastFocus&&lastFocus.focus)lastFocus.focus(); }catch(e){}
    if(cb)try{ cb(result); }catch(e){ console.error(e); }
    if(queue.length)setTimeout(function(){ show(queue.shift()); },120);
  }

  bYes.onclick=function(){
    if(active&&active.kind==='prompt'){
      var v=input.value;
      if(active.required&&!String(v).trim()){
        err.textContent=active.requiredMsg||'This cannot be empty';
        err.classList.add('on'); input.focus(); return;
      }
      done(v);
      return;
    }
    done(active&&active.kind==='alert'?undefined:true);
  };
  bNo.onclick=function(){ done(active&&active.kind==='prompt'?null:false); };
  ov.addEventListener('click',function(e){ if(e.target===ov&&active&&active.kind!=='alert')bNo.onclick(); });
  document.addEventListener('keydown',function(e){
    if(!active)return;
    if(e.key==='Escape'){ e.preventDefault(); active.kind==='alert'?done(undefined):bNo.onclick(); }
    else if(e.key==='Enter'&&document.activeElement!==bNo){ e.preventDefault(); bYes.onclick(); }
  });

  window.uiAlert=function(text,opts){
    opts=opts||{}; show({kind:'alert',text:text,tone:opts.tone||'info',title:opts.title,
      okText:opts.okText,cb:opts.cb});
  };
  window.uiConfirm=function(text,cb,opts){
    opts=opts||{}; show({kind:'confirm',text:text,tone:opts.tone||'warn',title:opts.title,
      okText:opts.okText,cancelText:opts.cancelText,cb:cb});
  };
  window.uiPrompt=function(text,cb,opts){
    opts=opts||{}; show({kind:'prompt',text:text,tone:opts.tone||'info',title:opts.title,
      okText:opts.okText||'Continue',password:opts.password,placeholder:opts.placeholder,
      value:opts.value,required:opts.required,requiredMsg:opts.requiredMsg,cb:cb});
  };

  /* Safe to override: no caller reads a return value from alert. */
  window.alert=function(text){
    var t=String(text==null?'':text);
    var tone=/fail|error|cannot|invalid|denied|wrong|expired|not\s/i.test(t)?'warn':'info';
    if(/deleted|removed|wiped|permanent/i.test(t))tone='dang';
    if(/success|saved|added|updated|complete|\u2705/i.test(t))tone='ok';
    window.uiAlert(t,{tone:tone});
  };
})();
</script>

</body>
</html>
