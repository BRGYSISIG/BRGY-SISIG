<script>
/* v7.1.2 FIX: this is the dashboard's one remote dependency and there was no
   guard on it. A blocked CDN or a shop with flaky internet meant "Chart is
   not defined" thrown out of a setTimeout and blank boxes with no
   explanation. Every figure on the page is computed locally, so the tables
   and totals are unaffected — only the drawing fails. */
if(typeof Chart==='undefined'){
  window.Chart=function(ctx){
    try{
      var w=ctx&&ctx.parentNode;
      if(w)w.innerHTML='<div style="display:flex;align-items:center;justify-content:center;'
        +'height:100%;padding:18px;text-align:center;font-size:13px;line-height:1.6;color:var(--t2)">'
        +'Charts need an internet connection.<br>All figures on this page are still live.</div>';
    }catch(e){}
    this.destroy=function(){};this.update=function(){};this.resize=function(){};
  };
}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;
  --bg1:#161b22;
  --bg2:#1c2333;
  --bg3:#21262d;
  --t1:#e6edf3;
  --t2:#8b949e;
  --t3:#484f58;
  --b1:rgba(48,54,61,0.8);
  --b2:rgba(48,54,61,1);
  --ac:#2f81f7;
  --ac2:#1a3d6e;
  --sg:#1a3a2a;
  --st:#3fb950;
  --wg:#3d2b00;
  --wt:#d29922;
  --dg:#3d1a1a;
  --dt:#f85149;
  --pg:#2d1b69;
  --pt:#a371f7;
  --gold:#e3b341;
  --navy:#0d1117;
}
/* Mobile top bar */
.mobile-topbar{display:none;position:fixed;top:0;left:0;right:0;height:52px;background:var(--bg1);border-bottom:1px solid var(--b1);z-index:150;align-items:center;padding:0 14px;gap:12px}
.hamburger{display:none;background:none;border:none;color:var(--t1);font-size:22px;cursor:pointer;padding:6px;flex-shrink:0}
.mobile-title{font-size:14px;font-weight:700;flex:1}
.mobile-biz{font-size:11px;color:var(--t3)}
/* Overlay */
.sidebar-overlay{display:none}
/* Bottom nav */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--bg1);border-top:1px solid var(--b1);z-index:150;justify-content:space-around;align-items:center;padding:0 4px}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;cursor:pointer;border-radius:8px;min-width:44px;border:none;background:none;color:var(--t3);transition:color .15s}
.bnav-item.active{color:var(--ac)}
.bnav-item i{font-size:20px}
.bnav-label{font-size:9px;font-weight:600}
/* Adjust main for mobile topbar */
@media(max-width:768px){.main{padding-top:64px}}
html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;background:var(--bg);color:var(--t1);font-size:14px}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.auth-card{background:var(--bg1);border:1px solid var(--b2);border-radius:16px;padding:36px 28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.auth-ico{width:44px;height:44px;border-radius:10px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff}
.auth-field{display:flex;flex-direction:column;gap:6px}
.auth-field label{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px}
.auth-field input{padding:12px 14px;border-radius:8px;border:1px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:14px;outline:none;width:100%;transition:border-color .2s}
.auth-field input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(47,129,247,0.1)}
.auth-btn{padding:13px;border-radius:8px;border:none;background:var(--ac);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s}
.auth-btn:hover{opacity:.9}
.auth-btn:disabled{opacity:.5}
.auth-err{font-size:13px;color:var(--dt);min-height:18px;text-align:center}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--bg1);border-right:1px solid var(--b1);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100;overflow-y:auto}
.sb-brand{padding:16px 18px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px}
.sb-ico{width:32px;height:32px;border-radius:8px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.sb-name{font-size:14px;font-weight:700;color:var(--t1)}
.sb-biz{font-size:11px;color:var(--t3)}
.nav{flex:1;padding:8px;display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--t2);font-size:13px;font-weight:500;border:none;background:none;width:100%;text-align:left;transition:all .15s}
.nav-item:hover{background:var(--bg2);color:var(--t1)}
.nav-item.active{background:rgba(47,129,247,0.15);color:var(--ac);font-weight:600}
.nav-item i{font-size:16px;flex-shrink:0}
.nav-section{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;padding:12px 10px 4px}
.sb-foot{padding:12px;border-top:1px solid var(--b1)}
.user-email{font-size:11px;color:var(--t3);padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.so-btn{padding:8px 10px;border-radius:6px;border:1px solid var(--b1);background:none;color:var(--t3);font-size:12px;cursor:pointer;width:100%;text-align:left;transition:all .15s}
.so-btn:hover{color:var(--dt);border-color:rgba(248,81,73,0.3);background:rgba(248,81,73,0.05)}
.main{margin-left:220px;flex:1;padding:28px;min-height:100vh;background:var(--bg)}
.page-title{font-size:20px;font-weight:700;margin-bottom:18px;color:var(--t1);letter-spacing:-.3px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--bg1);border:1px solid var(--b1);border-radius:10px;padding:16px;transition:border-color .2s}
.stat:hover{border-color:var(--b2)}
.stat-l{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.stat-v{font-size:22px;font-weight:800;letter-spacing:-.5px}
.stat-s{font-size:11px;color:var(--t2);margin-top:4px}
.stat.blue .stat-v{color:var(--ac)}
.stat.green .stat-v{color:var(--st)}
.stat.red .stat-v{color:var(--dt)}
.stat.amber .stat-v{color:var(--wt)}
.card{background:var(--bg1);border:1px solid var(--b1);border-radius:10px;padding:18px;margin-bottom:16px}
.card-hd{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--t1)}
.card-hd span{font-size:11px;font-weight:500;color:var(--t3)}
.chart-wrap{position:relative;height:220px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;padding:0 0 10px;text-align:left;border-bottom:1px solid var(--b1)}
.tbl td{padding:10px 0;border-bottom:1px solid var(--b1);color:var(--t2)}
.tbl td:first-child{color:var(--t1);font-weight:500}
.tbl tr:last-child td{border-bottom:none}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--b1);gap:12px}
.row:last-child{border-bottom:none}
.row-l{flex:1}
.row-name{font-size:14px;font-weight:600;color:var(--t1)}
.row-sub{font-size:12px;color:var(--t3);margin-top:2px}
.row-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.2px}
.b-green{background:rgba(63,185,80,0.12);color:var(--st);border:1px solid rgba(63,185,80,0.2)}
.b-blue{background:rgba(47,129,247,0.12);color:var(--ac);border:1px solid rgba(47,129,247,0.2)}
.b-red{background:rgba(248,81,73,0.12);color:var(--dt);border:1px solid rgba(248,81,73,0.2)}
.b-amber{background:rgba(210,153,34,0.12);color:var(--wt);border:1px solid rgba(210,153,34,0.2)}
.b-gray{background:var(--bg3);color:var(--t3);border:1px solid var(--b1)}
.b-purple{background:rgba(163,113,247,0.12);color:var(--pt);border:1px solid rgba(163,113,247,0.2)}
.filter-bar{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.fp{padding:6px 14px;border-radius:6px;border:1px solid var(--b2);background:transparent;color:var(--t2);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.fp:hover{color:var(--t1);border-color:var(--t3)}
.fp.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--t3);font-size:14px;gap:12px}
.spin{width:20px;height:20px;border:2px solid var(--b2);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--t3);font-size:13px}
.add-btn{padding:7px 14px;border-radius:7px;border:1px solid var(--ac);background:var(--ac);color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s}
.add-btn:hover{opacity:.85}

/* v7.7.2 added esc() to this payload; v7.8.2 finished the job.
   The helper landed but the CALL SITES were never brought across from the

function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];

/* api() lives further down, next to refreshDashSession(), because it needs
   to retry on 401. There used to be a second, non-retrying copy right here;
   because both were function declarations in the same scope the later one
   hoisted over this one from the very first line, so this copy never ran and

function authErrText(res,fallback){
  /* GoTrue answers in several shapes depending on version and endpoint:
       {error:'invalid_grant', error_description:'Invalid login credentials'}
       {code:400, msg:'Invalid login credentials', error_code:'invalid_credentials'}
       {error:{message:'...'}}   {message:'...'}
     Reading only res.error.message meant a string error silently became
     the useless generic line. */
  if(!res)return fallback;
  var m=(res.error&&res.error.message)||res.error_description||res.msg||res.message||
        (typeof res.error==='string'?res.error:'')||'';
  var code=String(res.error_code||res.code||res.error||'');
  if(/email_not_confirmed|not confirmed/i.test(m+code))
    return 'This email has not been confirmed yet. Open the confirmation link Supabase sent, or turn off email confirmation in Supabase \u2192 Authentication \u2192 Providers.';
  if(/invalid[_ ]?(login|grant|credentials)/i.test(m+code))
    return 'Wrong email or password. This is the account created on the POS \u2014 not the admin password.';
  return m||fallback;
}

  const keys=['sales','expenses','products','employees','attendance','customers','credit','suppliers','pos','ingredients','recipes','wastage','orders','loans','leaves','shifts'];
  /* v7.7.1 FIX: this was
       D[k]=Array.isArray(results[i])?results[i]:[];
     and api() returns null for every failure - a 403 from row-level security,
     an expired token, a dropped connection. All of them became an empty array,
     so a business with a year of takings rendered as PHP 0.00, no employees and
     no stock, with nothing on screen to say anything had gone wrong. The only
     trace was a console.error nobody reads.

     A failed read now leaves the previous data alone and says so. Empty is
     still empty - [] from the server is a real answer - but a failure is no
     longer indistinguishable from it. */
  const _failed=[];
  keys.forEach(function(k,i){
    if(Array.isArray(results[i]))D[k]=results[i];
    else{_failed.push(k);if(!Array.isArray(D[k]))D[k]=[];}
  });
  if(_failed.length){
    console.error('[ArroyoDash] read failed for:',_failed.join(', '));
    UI.loading=false;_loadDataBusy=false;
    render();
    updateSyncStatus('error','Could not load '+_failed.length+' table(s) — figures below may be incomplete');
    if(!_readFailWarned){
      _readFailWarned=true;
      alert('Some data could not be loaded ('+_failed.join(', ')+').\n\n'
        +'The figures on screen are incomplete. This is usually an expired '
        +'session or a row-level-security policy. Sign out and back in; if it '
        +'persists, run the v7.7.1 SQL script.');
    }
    return;
  }
  _readFailWarned=false;
  console.log('[ArroyoDash] Data loaded - sales:',D.sales.length,'expenses:',D.expenses.length,'products:',D.products.length);
  UI.loading=false;
  await loadSettingsFromCloud();
  _loadDataBusy=false;
  /* render() rebuilds the sidebar, and the fresh dashSyncLbl starts out
     reading plain "Synced" — so the status has to be written after the
     rebuild, not before it, or the timestamp is thrown away immediately. */
  render();
  updateSyncStatus('idle','Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
}

function filteredSales(){
  const now=new Date();
  return D.sales.filter(function(s){
    if(s.voided)return false;
    const d=new Date(s.date);
    if(UI.filter==='today')return d.toDateString()===now.toDateString();
    if(UI.filter==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return d>=w;}
    if(UI.filter==='month'){const m=new Date(now);m.setDate(m.getDate()-30);return d>=m;}
    return true;
  });
}
function filteredExp(){
  const now=new Date();
  return D.expenses.filter(function(e){
    const d=new Date(e.date);
    if(UI.filter==='today')return d.toDateString()===now.toDateString();
    if(UI.filter==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return d>=w;}
    if(UI.filter==='month'){const m=new Date(now);m.setDate(m.getDate()-30);return d>=m;}
    return true;

/* ── ONE PERIOD, ONE SET OF NUMBERS ───────────────────────────────────
 * Overview, Reports and P&L each used to build their own bottom line, so
 * the same shop showed two different net profits depending on which page
 * you were looking at. Everything below is shared, and every page now
 * subtracts the same costs over the same window.
 * ==================================================================== */

// Length of the selected period in days, used to prorate monthly costs.
function periodDays(){
  if(UI.filter==='today')return 1;
  if(UI.filter==='week')return 7;
  if(UI.filter==='month')return 30;
  // 'all' — span whatever data is actually held, never less than a day.
  const ts=(D.sales||[]).map(function(s){return new Date(s.date).getTime();})
    .filter(function(t){return !isNaN(t);});
  if(!ts.length)return 1;
  /* Math.ceil turned a span of exactly 10 days into 11, which inflated
     every prorated monthly cost on the "all" filter. */
  const span=(Date.now()-Math.min.apply(null,ts))/86400000;
  return Math.max(1,Math.round(span));
}

function inPeriod(dateVal){
  const d=new Date(dateVal);
  if(isNaN(d.getTime()))return false;
  const now=new Date();
  if(UI.filter==='today')return d.toDateString()===now.toDateString();
  if(UI.filter==='week'){const x=new Date(now);x.setDate(x.getDate()-7);return d>=x;}
  if(UI.filter==='month'){const x=new Date(now);x.setDate(x.getDate()-30);return d>=x;}
  return true;
}

/* Wastage was all-time while the statement was labelled "this week".
   Filter it the same way sales and expenses are filtered. */
function filteredWastage(){
  return (D.wastage||[]).filter(function(w){return inPeriod(w.date);});
}
function wastageCost(){
  return filteredWastage().reduce(function(a,w){return a+(+w.cost||0);},0);
}

/* Labour for the selected period.
   The old P&L summed raw monthly salaries and ignored the filter entirely,
   so with the filter on "today" a whole month of wages was subtracted from
   one day of revenue. It also counted only monthly staff, so hourly, daily
   and commission people cost the business nothing on paper. Prorate the
   monthly ones and price the rest the way the payslip already does. */
function laborCost(){
  const days=periodDays();
  return (D.employees||[]).reduce(function(a,e){
    const rate=+e.rate||0;
    if(e.pay_type==='monthly')return a+rate*(days/30);
    const att=(D.attendance||[]).filter(function(r){
      return r.employee_id===e.id&&r.hours_worked&&inPeriod(r.date);
    });
    if(e.pay_type==='hourly'){
      return a+att.reduce(function(b,r){return b+(+r.hours_worked||0);},0)*rate;
    }
    if(e.pay_type==='daily'){
      return a+(new Set(att.map(function(r){return r.date;})).size)*rate;
    }
    if(e.pay_type==='commission'){
      const own=(D.sales||[]).filter(function(s){
        return s&&!s.voided&&s.cashier===e.name&&inPeriod(s.date);
      }).reduce(function(b,s){return b+(+s.total||0);},0);
      return a+own*((+e.commission_pct||0)/100);
    }
    return a;
  },0);
}

/* The single source of truth for the bottom line. `vat` is reported for the
   statement but is NOT subtracted from profit: it is a pass-through the shop
   collects and remits, not a cost of trading. The P&L used to print a
   "Net sales (excl. VAT)" line and then compute gross profit off gross
   sales anyway, which made the waterfall impossible to follow. */
function calcPnL(fs,fe){
  const rev=(fs||[]).reduce(function(a,s){return a+(+s.total||0);},0);
  const exp=(fe||[]).reduce(function(a,e){return a+(+e.amount||0);},0);
  const cogs=calcCOGS(fs);
  const waste=wastageCost();
  const labor=laborCost();
  const totalCogs=cogs+waste;
  const grossProfit=rev-totalCogs;
  const totalOpex=exp+labor;
  const netProfit=grossProfit-totalOpex;
  return {rev:rev,exp:exp,cogs:cogs,waste:waste,labor:labor,
    totalCogs:totalCogs,totalOpex:totalOpex,
    grossProfit:grossProfit,netProfit:netProfit,
    vat:rev/1.12*0.12,netSales:rev-rev/1.12*0.12,
    grossMargin:rev>0?Math.round(grossProfit/rev*100):0,
    netMargin:rev>0?Math.round(netProfit/rev*100):0};
}

function topProds(){
  const map={};
  D.sales.filter(function(s){return!s.voided;}).forEach(function(s){
    (s.items||[]).forEach(function(it){
      if(!map[it.name])map[it.name]={name:it.name,qty:0,rev:0};
      map[it.name].qty+=(it.qty||1);map[it.name].rev+=(it.price||0)*(it.qty||1);
    });
  });
  return Object.values(map).sort(function(a,b){return b.rev-a.rev;}).slice(0,8);
}
function salesByDay(){
  const map={};
  filteredSales().forEach(function(s){
    const k=new Date(s.date).toLocaleDateString('en-PH',{month:'short',day:'numeric'});
    map[k]=(map[k]||0)+s.total;
  });
  const days=Object.keys(map);
  return{labels:days,data:days.map(function(k){return map[k];})};
}

function calcCOGS(salesArr){
  // Calculate Cost of Goods Sold from recipes
  let cogs=0;
  salesArr.filter(function(s){return!s.voided;}).forEach(function(s){
    (s.items||[]).forEach(function(item){
      const recipes=D.recipes.filter(function(r){return r.product_name===item.name;});
      recipes.forEach(function(r){
        const ing=D.ingredients.find(function(i){return i.id===r.ingredient_id;});
        // (item.qty||1) turned a legitimate qty of 0 into 1.
        if(ing)cogs+=r.qty_used*(item.qty!=null?Number(item.qty):1)*ingCost(ing);
      });
    });
  });
  return cogs;
}

/* ==================================================================== *
 * INVENTORY — grouped by category
 *
 * This page used to be one flat list of every product, sorted only by
 * stock level. A cafe with 120 items across eight categories had no way
 * to look at just the pastries, and the only way to find a category's
 * shortages was to read the whole list. It is now grouped per category,
 * with a chip bar to narrow to one, and each category carries its own
 * item count, shortage count and stock value.
 *
 * Sorting *inside* a category is still stock-ascending, so whatever is
 * about to run out stays at the top where it was.
 * ==================================================================== */

/* Blank, null and whitespace-only categories all collapse to one bucket
   rather than appearing as several different empty-looking groups. */
function invCatOf(p){
  var c=(p&&p.cat!==undefined&&p.cat!==null)?String(p.cat).trim():'';
  return c||'Uncategorised';
}

/* 999 is the app's "not tracked" sentinel, so it contributes no countable
   value — otherwise every unlimited item would add 999 x its price and the
   figure would be nonsense. */
function invStockValue(list){
  return (list||[]).reduce(function(a,p){
    if(p.stock===999)return a;
    return a+((+p.price||0)*(+p.stock||0));
  },0);
}
function invIsOut(p){return p.stock!==999&&p.stock<=0;}
function invIsLow(p){return p.stock!==999&&p.stock>0&&p.stock<=5;}

function invGroups(products){
  var map={},order=[];
  (products||[]).forEach(function(p){
    var k=invCatOf(p);
    if(!map[k]){map[k]=[];order.push(k);}
    map[k].push(p);
  });
  order.sort(function(a,b){
    if(a==='Uncategorised')return 1;          /* always last */
    if(b==='Uncategorised')return -1;
    return a.localeCompare(b);
  });
  return order.map(function(k){
    /* .slice() first: the old code called D.products.sort(), which sorts
       the shared array in place and left every other page reading a
       list reordered by stock level as a side effect of visiting this
       one. */
    var items=map[k].slice().sort(function(x,y){
      var xs=(x.stock===999)?Infinity:(+x.stock||0);
      var ys=(y.stock===999)?Infinity:(+y.stock||0);
      return xs-ys;
    });
    return {cat:k,items:items,
      out:items.filter(invIsOut).length,
      low:items.filter(invIsLow).length,
      value:invStockValue(items)};
  });
}

function invRow(p){
  const isOut=invIsOut(p),isLow=invIsLow(p);
  const r=el('div','row');
  const rl=el('div','row-l');
  rl.innerHTML='<div class="row-name">'+esc(p.name)+'</div>'
    +'<div class="row-sub">'+esc(invCatOf(p))+' \u00b7 '+fmt(p.price)+'</div>';
  const rr=el('div','row-r');
  rr.appendChild(el('span','badge '+(isOut?'b-red':isLow?'b-amber':'b-green'),
    p.stock===999?'Unlimited':isOut?'Out':isLow?p.stock+' low':p.stock+' in stock'));
  const edBtn=el('button','sm-btn','Edit');
  edBtn.style.cssText='padding:4px 10px;font-size:11px;border-radius:5px;border:1px solid var(--b2);background:none;color:var(--t2);cursor:pointer;margin-left:6px';
  edBtn.onclick=function(){UI.modal={type:'product',item:p};render();};
  rr.appendChild(edBtn);

  syncInvBtn.onclick=async function(){syncInvBtn.textContent='Syncing...';syncInvBtn.disabled=true;await loadData();syncInvBtn.textContent='\u27f3 Sync from POS';syncInvBtn.disabled=false;};
  const addItemBtn=el('button','add-btn','+ Add Item');
  addItemBtn.style.cssText='background:var(--st);border-color:var(--st)';
  addItemBtn.onclick=function(){UI.modal={type:'product',item:null};render();};
  btnRow.appendChild(syncInvBtn);btnRow.appendChild(addItemBtn);
  hRow.appendChild(btnRow);main.appendChild(hRow);

  const prods=D.products||[];
  const groups=invGroups(prods);
  const low=prods.filter(invIsLow).length;
  const out=prods.filter(invIsOut).length;

  const sg=el('div','stats-grid');
  sg.appendChild(statCard('Items',prods.length,'',''));
  sg.appendChild(statCard('Categories',groups.length,'',''));
  sg.appendChild(statCard('Low stock',low,'','red'));
  sg.appendChild(statCard('Out of stock',out,'','red'));
  sg.appendChild(statCard('Stock value',fmt(invStockValue(prods)),'at selling price',''));
  main.appendChild(sg);

  if(!prods.length){
    const c0=el('div','card');
    const h0=el('div','card-hd','All products');
    h0.appendChild(addBtn('+ Add',function(){UI.modal={type:'product',item:null};render();}));
    c0.appendChild(h0);
    const em=el('div','empty','No products yet. Tap <strong>+ Add Item</strong> above to add one, or sync from POS.');
    em.style.lineHeight='1.7';c0.appendChild(em);main.appendChild(c0);return;
  }

  /* A category the operator just renamed or emptied would otherwise leave
     the page filtered to something that no longer exists, showing nothing
     and looking broken. */
  if(UI.invCat&&UI.invCat!=='all'&&!groups.some(function(g){return g.cat===UI.invCat;}))
    UI.invCat='all';
  if(!UI.invCat)UI.invCat='all';

  /* Only worth a chip bar once there is more than one category to pick. */
  if(groups.length>1){
    const fb=el('div','filter-bar');
    const chip=function(label,id,tip){
      const p=el('div','fp'+(UI.invCat===id?' on':''),esc(label));
      /* The light theme styles .fp as a segmented control with the right
         border only on :last-child. Category chips wrap onto several
         lines, where that leaves a gap on the end of every row but the
         last, so each chip carries its own right border. */
      p.style.borderRightWidth='1.5px';
      if(tip)p.title=tip;
      p.onclick=function(){UI.invCat=id;render();};
      return p;
    };
    fb.appendChild(chip('All \u00b7 '+prods.length,'all',
      out?out+' out of stock across all categories':''));
    groups.forEach(function(g){
      /* A dot on the chip means this category needs attention, so a
         shortage is visible without opening the category first. */
      const flag=g.out?' \u25cf':(g.low?' \u25cb':'');
      const tip=g.out?(g.out+' out of stock'+(g.low?', '+g.low+' low':''))
                     :(g.low?g.low+' running low':'');
      fb.appendChild(chip(g.cat+' \u00b7 '+g.items.length+flag,g.cat,tip));
    });
    main.appendChild(fb);
  }

  const shown=(UI.invCat==='all')?groups
    :groups.filter(function(g){return g.cat===UI.invCat;});

  shown.forEach(function(g){
    const c=el('div','card');
    const meta=g.items.length+' item'+(g.items.length===1?'':'s')
      +(g.out?' \u00b7 '+g.out+' out':'')
      +(g.low?' \u00b7 '+g.low+' low':'')
      +' \u00b7 '+fmt(g.value);
    const chd=el('div','card-hd',esc(g.cat)+' <span>'+esc(meta)+'</span>');
    /* Adding from inside a category pre-fills that category, so building
       out one section does not mean retyping it on every item. */
    chd.appendChild(addBtn('+ Add',function(){
      UI.modal={type:'product',item:null,defCat:(g.cat==='Uncategorised'?'':g.cat)};render();}));
    c.appendChild(chd);
    g.items.forEach(function(p){c.appendChild(invRow(p));});
    main.appendChild(c);
  });
}

function renderEmployees(main,fs){
  main.appendChild(el('div','page-title','Employees'));

  const now=new Date();
  const todayStr=now.toISOString().slice(0,10);
  const todayAtt=D.attendance.filter(function(a){return a.date===todayStr||new Date(a.date).toDateString()===now.toDateString();});
  const clockedInNow=todayAtt.filter(function(a){return a.time_in&&!a.time_out;}).length;
  const completedToday=todayAtt.filter(function(a){return a.time_in&&a.time_out;}).length;
  const totalHrsToday=todayAtt.reduce(function(a,r){return a+(r.hours_worked||0);},0);

  // Period attendance for stats
  const fAtt=D.attendance.filter(function(a){
    const d=new Date(a.date);
    if(UI.filter==='today')return d.toDateString()===now.toDateString();
    if(UI.filter==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return d>=w;}
    if(UI.filter==='month'){const m=new Date(now);m.setDate(m.getDate()-30);return d>=m;}
    return true;
  });
  const totalHrs=fAtt.reduce(function(a,r){return a+(r.hours_worked||0);},0);

  // --- Stats row ---
  const sg=el('div','stats-grid');
  sg.appendChild(statCard('Team size',D.employees.length,'employees',''));
  sg.appendChild(statCard('On shift now',clockedInNow,'clocked in','green'));
  sg.appendChild(statCard('Hours today',totalHrsToday.toFixed(1)+'h','completed shifts','blue'));
  sg.appendChild(statCard('Active loans',D.loans.filter(function(l){return l.status==='active';}).length,'','amber'));
  main.appendChild(sg);

  // ============================================================
  // TODAY'S SHIFT BOARD
  // ============================================================
  const shiftCard=el('div','card');
  const shiftHd=el('div','shift-header');
  shiftHd.innerHTML='<div class="card-hd" style="margin:0">Today\'s Shift Board</div>'
    +'<div class="shift-date">'+now.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</div>';
  shiftCard.appendChild(shiftHd);

  // Summary pills
  const sumRow=el('div','shift-summary');
  sumRow.innerHTML='<div class="shift-pill in"><span class="shift-dot"></span>'+clockedInNow+' On shift</div>'
    +'<div class="shift-pill out"><span class="shift-dot"></span>'+completedToday+' Completed</div>'
    +(D.employees.length-clockedInNow-completedToday>0?'<div class="shift-pill out"><span class="shift-dot"></span>'+(D.employees.length-clockedInNow-completedToday)+' Not in yet</div>':'')
    +'<div class="shift-pill total"><i class="ti ti-clock" style="font-size:12px"></i>'+totalHrsToday.toFixed(1)+'h total today</div>';
  shiftCard.appendChild(sumRow);

  if(!D.employees.length){
    shiftCard.appendChild(el('div','empty','No employees yet'));
  } else {
    // Sort: clocked-in first, then completed, then absent
    const sorted=D.employees.slice().sort(function(a,b){
      const aAtt=todayAtt.filter(function(x){return x.employee_id===a.id;});
      const bAtt=todayAtt.filter(function(x){return x.employee_id===b.id;});
      const aIn=aAtt.some(function(x){return x.time_in&&!x.time_out;});
      const bIn=bAtt.some(function(x){return x.time_in&&!x.time_out;});
      const aDone=aAtt.some(function(x){return x.time_in&&x.time_out;});
      const bDone=bAtt.some(function(x){return x.time_in&&x.time_out;});
      if(aIn&&!bIn)return -1;if(!aIn&&bIn)return 1;
      if(aDone&&!bDone)return -1;if(!aDone&&bDone)return 1;
      return a.name.localeCompare(b.name);
    });

    sorted.forEach(function(e){
      const empAtt=todayAtt.filter(function(a){return a.employee_id===e.id;});
      const activeShift=empAtt.find(function(a){return a.time_in&&!a.time_out;});
      const lastShift=empAtt.filter(function(a){return a.time_in&&a.time_out;}).sort(function(a,b){return new Date(b.time_in)-new Date(a.time_in);})[0];
      const isClockedIn=!!activeShift;
      const hasDone=!!lastShift;

      const row=el('div','shift-row '+(isClockedIn?'clocked-in':'clocked-out'));
      const av=el('div','shift-av '+(isClockedIn?'in':'out'),(e.name||'?')[0].toUpperCase());
      const info=el('div','shift-info');
      const timesEl=el('div','shift-times');

      if(isClockedIn){
        const inTime=new Date(activeShift.time_in);
        const elapsed=Math.floor((now-inTime)/60000);
        const elapsedStr=elapsed>=60?(Math.floor(elapsed/60)+'h '+(elapsed%60)+'m'):elapsed+'m';
        timesEl.innerHTML='<div class="shift-time-in"><i class="ti ti-login"></i>'+ft(activeShift.time_in)+'</div>'
          +'<span class="shift-sep">&rarr;</span>'
          +'<span class="att-active-badge">&#9679; Active '+elapsedStr+'</span>';
      } else if(hasDone){
        timesEl.innerHTML='<div class="shift-time-in"><i class="ti ti-login"></i>'+ft(lastShift.time_in)+'</div>'
          +'<span class="shift-sep">&rarr;</span>'
          +'<div class="shift-time-out"><i class="ti ti-logout"></i>'+ft(lastShift.time_out)+'</div>';
      } else {
        timesEl.innerHTML='<span class="shift-noshow">No shift recorded today</span>';
      }

      // All shifts today (multiple clock-ins)
      const allShiftsToday=empAtt.filter(function(a){return a.time_in&&a.time_out;});
      const totalEmpHrs=empAtt.reduce(function(a,r){return a+(r.hours_worked||0);},0);

      info.innerHTML='<div class="shift-name">'+esc(e.name)+'</div><div class="shift-role">'+esc(e.role)+'</div>';
      info.appendChild(timesEl);
      if(allShiftsToday.length>1){
        const multi=el('div','shift-duration');multi.textContent=allShiftsToday.length+' shifts today';
        info.appendChild(multi);
      }

      const hrs=el('div','shift-hrs '+(isClockedIn?'active':hasDone?'done':'none'));
      if(isClockedIn){
        const elapsed=Math.floor((now-new Date(activeShift.time_in))/3600000*10)/10;
        hrs.textContent=elapsed.toFixed(1)+'h+';
      } else if(totalEmpHrs>0){
        hrs.textContent=totalEmpHrs.toFixed(1)+'h';
      } else {
        hrs.textContent='—';
      }

      // Click to view employee's full att history
      row.style.cursor='pointer';
      row.onclick=function(){UI.modal={type:'empAtt',item:e};render();};
      row.appendChild(av);row.appendChild(info);row.appendChild(hrs);
      shiftCard.appendChild(row);
    });

    const hint=el('div','');
    hint.style.cssText='font-size:11px;color:var(--t3);text-align:center;padding:8px 0 0;';
    hint.textContent='Tap any employee to view their full attendance history';
    shiftCard.appendChild(hint);
  }
  main.appendChild(shiftCard);

  // ============================================================
  // EMPLOYEE LIST (manage)
  // ============================================================
  const empSec=el('div','card');
  const empHd=el('div','card-hd','Team');
  empHd.appendChild(addBtn('+ Add employee',function(){UI.modal={type:'emp',item:null};render();}));
  empSec.appendChild(empHd);

  if(!D.employees.length){
    empSec.appendChild(el('div','empty','No employees yet — add your first one'));
  } else {
    const grid=el('div','emp-grid');
    D.employees.forEach(function(e){
      const empAtt=todayAtt.filter(function(a){return a.employee_id===e.id;});
      const isClockedIn=empAtt.some(function(a){return a.time_in&&!a.time_out;});
      const activeShift=empAtt.find(function(a){return a.time_in&&!a.time_out;});
      const payLabel=e.pay_type==='hourly'?'PHP '+e.rate+'/hr'
        :e.pay_type==='daily'?'PHP '+e.rate+'/day'
        :e.pay_type==='monthly'?'PHP '+Number(e.rate).toLocaleString()+'/mo'
        :e.commission_pct+'% commission';

      const card=el('div','emp-card2');
      const head=el('div','emp-head');
      const av=el('div','emp-av2',(e.name||'?')[0].toUpperCase());
      const meta=el('div','emp-meta');
      meta.innerHTML='<div class="emp-name2">'+esc(e.name)+'</div>'
        +'<div class="emp-role2">'
        +'<span class="emp-status-dot '+(isClockedIn?'in':'out')+'"></span>'
        +'<span style="font-size:11px;color:var(--t3)">'+e.role+'</span>'
        +(isClockedIn&&activeShift?'<span style="font-size:10px;font-weight:700;color:var(--st);background:rgba(63,185,80,0.1);padding:1px 7px;border-radius:20px;border:1px solid rgba(63,185,80,0.2)">IN '+ft(activeShift.time_in)+'</span>':'')
        +'</div>';
      head.appendChild(av);head.appendChild(meta);
      const pay=el('div','emp-pay2',payLabel);
      const actions=el('div','emp-actions');
      function smBtn(lbl,fn){const b=el('button','sm-btn',lbl);b.onclick=fn;return b;}
      actions.appendChild(smBtn('History',function(){UI.modal={type:'empAtt',item:e};render();}));
      actions.appendChild(smBtn('Payslip',function(){UI.modal={type:'payslip',item:e};render();}));
      actions.appendChild(smBtn('Loan',function(){UI.modal={type:'loan',item:null,emp:e};render();}));
      actions.appendChild(smBtn('Edit',function(){UI.modal={type:'emp',item:e};render();}));
      card.appendChild(head);card.appendChild(pay);card.appendChild(actions);
      grid.appendChild(card);
    });
    empSec.appendChild(grid);
  }
  main.appendChild(empSec);

  // ============================================================
  // ATTENDANCE HISTORY (period)
  // ============================================================
  main.appendChild(filterBar());
  const attSec=el('div','card');
  const attHd=el('div','card-hd');
  attHd.innerHTML='Attendance history <span>'+fAtt.length+' records · '+totalHrs.toFixed(1)+'h total</span>';
  attSec.appendChild(attHd);

  if(!fAtt.length){
    attSec.appendChild(el('div','empty','No attendance records for this period'));
  } else {
    // Group by date descending
    const byDate={};
    fAtt.forEach(function(a){
      const k=new Date(a.date).toDateString();
      if(!byDate[k])byDate[k]=[];
      byDate[k].push(a);
    });
    const dateKeys=Object.keys(byDate).sort(function(a,b){return new Date(b)-new Date(a);});
    dateKeys.slice(0,14).forEach(function(dateStr){
      const records=byDate[dateStr];
      const y=new Date(now);y.setDate(y.getDate()-1);
      const lbl=dateStr===now.toDateString()?'Today'
        :dateStr===y.toDateString()?'Yesterday'
        :new Date(dateStr).toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'});
      const dayHrs=records.reduce(function(a,r){return a+(r.hours_worked||0);},0);
      const dayGroup=el('div','att-day-group');
      const dayLbl=el('div','att-day-label');
      dayLbl.innerHTML=lbl
        +'<span style="font-size:11px;color:var(--ac);font-weight:600;letter-spacing:0">'+(dayHrs>0?dayHrs.toFixed(1)+'h':'')+'</span>';
      dayGroup.appendChild(dayLbl);
      records.sort(function(a,b){return new Date(a.time_in)-new Date(b.time_in);}).forEach(function(a){
        const isActive=a.time_in&&!a.time_out;
        const row=el('div','att-row2');
        const avatar=el('div','att-avatar',(a.employee_name||'?')[0].toUpperCase());
        const info=el('div','att-info');
        const times=el('div','att-times');
        if(a.time_in){times.innerHTML+='<div class="att-time-block"><i class="ti ti-login" style="color:var(--st)"></i><span>'+ft(a.time_in)+'</span></div>';}
        if(a.time_in){times.innerHTML+='<span class="att-arrow">&rarr;</span>';}
        if(a.time_out){times.innerHTML+='<div class="att-time-block"><i class="ti ti-logout" style="color:var(--t3)"></i><span>'+ft(a.time_out)+'</span></div>';}
        else if(isActive){times.innerHTML+='<span class="att-active-badge">&#9679; Active</span>';}
        info.innerHTML='<div class="att-name2">'+esc(a.employee_name)+'</div>';
        info.appendChild(times);
        const hrs=el('div','att-hours'+(isActive?' active':''));
        hrs.textContent=a.hours_worked?a.hours_worked.toFixed(1)+'h':isActive?'-':'-';
        row.appendChild(avatar);row.appendChild(info);row.appendChild(hrs);
        dayGroup.appendChild(row);
      });
      attSec.appendChild(dayGroup);
    });
    if(dateKeys.length>14){
      const more=el('div','');more.style.cssText='text-align:center;font-size:12px;color:var(--t3);padding:8px 0';
      more.textContent='Showing 14 days — use filter to narrow down';
      attSec.appendChild(more);
    }
  }
  main.appendChild(attSec);

  // --- Loans ---
  const activeLoans=D.loans.filter(function(l){return l.status==='active';});
  const loanCard=el('div','card');
  const lhd=el('div','card-hd','Loans / cash advances');
  lhd.appendChild(addBtn('+ New loan',function(){UI.modal={type:'loan',item:null,emp:null};render();}));
  loanCard.appendChild(lhd);
  activeLoans.forEach(function(l){
    const r=el('div','row');
    r.innerHTML='<div class="row-l"><div class="row-name">'+esc(l.employee_name)+'</div><div class="row-sub">'+fd(l.date)+' · '+esc(l.reason)+'</div></div>'
      +'<div class="row-r"><div style="font-weight:700;color:var(--wt)">'+fmt(l.balance)+' left</div><div style="font-size:11px;color:var(--t3)">of '+fmt(l.amount)+'</div></div>';
    loanCard.appendChild(r);
  });
  if(!activeLoans.length)loanCard.appendChild(el('div','empty','No active loans'));
  main.appendChild(loanCard);

  // --- Leave Requests ---
  const pendLeaves=D.leaves.filter(function(l){return l.status==='pending';});
  const leaveCard=el('div','card');
  const leavehd=el('div','card-hd','Leave requests'+(pendLeaves.length?' <span style="background:var(--wg);color:var(--wt);padding:2px 8px;border-radius:20px;font-size:11px">'+pendLeaves.length+' pending</span>':''));
  leavehd.appendChild(addBtn('+ New request',function(){UI.modal={type:'leave',item:null,emp:null};render();}));
  leaveCard.appendChild(leavehd);
  D.leaves.slice(0,10).forEach(function(l){
    const scls={pending:'b-amber',approved:'b-green',rejected:'b-red'}[l.status]||'b-gray';
    const r=el('div','row');
    r.innerHTML='<div class="row-l"><div class="row-name">'+esc(l.employee_name)+'</div><div class="row-sub">'+esc(l.type).toUpperCase()+' · '+fd(l.date_from)+' to '+fd(l.date_to)+' ('+l.days+'d)</div></div>'
      +'<div class="row-r"><span class="badge '+scls+'">'+l.status.toUpperCase()+'</span>'
      +(l.status==='pending'?'<button class="sm-btn" onclick="api(\'/rest/v1/leaves?id=eq.'+l.id+'\',{method:\'PATCH\',body:JSON.stringify({status:\'approved\'})}).then(loadData)">Approve</button>':'')
      +'</div>';
    leaveCard.appendChild(r);
  });
  if(!D.leaves.length)leaveCard.appendChild(el('div','empty','No leave requests'));
  main.appendChild(leaveCard);

  // --- Sales Performance ---
  const salesByEmp={};
  D.sales.filter(function(s){return!s.voided&&s.cashier;}).forEach(function(s){
    if(!salesByEmp[s.cashier])salesByEmp[s.cashier]={name:s.cashier,txns:0,rev:0};
    salesByEmp[s.cashier].txns++;salesByEmp[s.cashier].rev+=s.total;
  });
  const empSales=Object.values(salesByEmp).sort(function(a,b){return b.rev-a.rev;});
  if(empSales.length){
    const sc=el('div','card');sc.innerHTML='<div class="card-hd">Sales performance</div>';
    empSales.forEach(function(e,i){
      const item=el('div','top-item');
      item.innerHTML='<div class="top-rank">'+(i+1)+'</div><div class="top-info"><div class="top-name">'+esc(e.name)+'</div><div class="top-sub">'+e.txns+' transactions</div></div><div class="top-val">'+fmt(e.rev)+'</div>';
      sc.appendChild(item);
    });
    main.appendChild(sc);
  }
}

     checkout path as the POS so sales and reports are never double-counted. */

function renderSettings(main){
  main.appendChild(el('div','page-title','Settings'));

  /* ── QR Payment Code ─────────────────────────────────────────────── */
  const qCard=el('div','card');
  const qHd=el('div','card-hd','QR Payment Code');qCard.appendChild(qHd);

  const qBody=el('div','');qBody.style.cssText='padding:14px;display:flex;flex-direction:column;gap:14px';

  /* Load current QR from businesses table */
  function loadCurrentQr(){
    qBody.innerHTML='<div style="color:var(--t3);font-size:13px">Loading...</div>';
    api('/rest/v1/businesses?id=eq.'+SESSION.bizId+'&select=qr_code,qr_checksum').then(function(r){
      qBody.innerHTML='';
      const row=(r&&r[0])||{};
      if(row.qr_code){
        /* Always show on white background — dark theme must not invert QR */
        const prevWrap=el('div','');
        prevWrap.style.cssText='background:#fff;border:2px solid var(--b2);padding:12px;display:inline-block;margin-bottom:4px';
        const prevImg=document.createElement('img');
        prevImg.src=row.qr_code;
        prevImg.style.cssText='max-width:180px;max-height:180px;display:block;image-rendering:pixelated';
        prevWrap.appendChild(prevImg);
        qBody.appendChild(prevWrap);
        if(row.qr_checksum){
          const chkEl=el('div','');chkEl.style.cssText='font-size:10px;color:var(--t3);font-family:monospace;margin-bottom:8px';
          chkEl.textContent='SHA-256: '+row.qr_checksum.slice(0,16)+'…';
          qBody.appendChild(chkEl);
        }
        const rmBtn=el('button','sm-btn','Remove QR code');
        rmBtn.style.cssText='margin-bottom:10px;color:var(--dt);border-color:var(--dt)';
        rmBtn.onclick=async function(){
          rmBtn.disabled=true;rmBtn.textContent='Removing…';
          await api('/rest/v1/businesses?id=eq.'+SESSION.bizId,{
            method:'PATCH',headers:{'Prefer':'return=minimal'},
            body:JSON.stringify({qr_code:null,qr_checksum:null})
          });
          loadCurrentQr();
        };
        qBody.appendChild(rmBtn);
      } else {
        const none=el('div','');none.style.cssText='font-size:13px;color:var(--t3);margin-bottom:10px';
        none.textContent='No QR code uploaded. The POS will show a "no QR" warning when QR payment is selected.';
        qBody.appendChild(none);
      }

      /* Upload input */
      const upLbl=el('div','');upLbl.style.cssText='font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px';
      upLbl.textContent=row.qr_code?'Replace QR code':'Upload QR code (PNG / JPG / SVG, max 512 KB)';
      qBody.appendChild(upLbl);

      const fileInp=document.createElement('input');fileInp.type='file';
      fileInp.accept='image/png,image/jpeg,image/svg+xml';
      fileInp.style.cssText='width:100%;padding:10px;border:1.5px dashed var(--b2);background:var(--bg2);font-size:14px;cursor:pointer';
      fileInp.onchange=async function(){
        const file=this.files[0];if(!file)return;
        if(file.size>512*1024){alert('Image too large (max 512 KB)');return;}
        const reader=new FileReader();
        reader.onload=async function(ev){
          const dataUri=ev.target.result;
          /* SHA-256 checksum for integrity verification on POS */
          let checksum='';
          try{
            const enc=new TextEncoder();
            const buf=await crypto.subtle.digest('SHA-256',enc.encode(dataUri));
            checksum=Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
          }catch(e){}
          const ok=await api('/rest/v1/businesses?id=eq.'+SESSION.bizId,{
            method:'PATCH',headers:{'Prefer':'return=minimal'},
            body:JSON.stringify({qr_code:dataUri,qr_checksum:checksum||null})
          });
          if(ok===null){alert('Upload failed. Check connection.');return;}
          alert('QR code saved!\nChecksum: '+(checksum?checksum.slice(0,16)+'…':'(unavailable)'));
          loadCurrentQr();
        };
        reader.readAsDataURL(file);
      };
      qBody.appendChild(fileInp);

      const hint=el('div','');hint.style.cssText='font-size:11px;color:var(--t3);margin-top:6px;line-height:1.6';
      hint.textContent='Tip: The POS renders the QR on a white background even in dark mode so it always scans correctly. After uploading here, open Admin → Settings in the POS and tap Sync to load the new code.';
      qBody.appendChild(hint);
    });
  }
  loadCurrentQr();
  qCard.appendChild(qBody);
  main.appendChild(qCard);
}

/* ==================================================================== *
 * CASH DRAWER
 *
 * Reads the `shifts` table the POS writes on check-out. Negative variance is
 * short, positive is over, and a NULL counted_cash means the drawer was never
 * counted at all — which is reported as its own state rather than being
 * folded in as a zero, because "nobody counted" and "counted and balanced"
 * are very different facts about a shift.
 * ==================================================================== */
function dashEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function renderShifts(main){
  main.appendChild(el('div','page-title','Cash drawer'));

  const all=(D.shifts||[]).slice();
  if(!all.length){
    const c0=el('div','card');
    c0.innerHTML='<div class="card-hd">Shifts</div>';
    c0.appendChild(el('div','empty','No shifts recorded yet. A shift appears here once a cashier checks out and counts the drawer in the POS.'));
    main.appendChild(c0);
    return;
  }

  const counted=all.filter(function(x){return x.counted_cash!==null&&x.counted_cash!==undefined;});
  const uncounted=all.filter(function(x){return x.counted_cash===null||x.counted_cash===undefined;});
  const shortOnes=counted.filter(function(x){return (+x.variance||0)<-0.005;});
  const overOnes=counted.filter(function(x){return (+x.variance||0)>0.005;});
  const netVar=counted.reduce(function(a,x){return a+(+x.variance||0);},0);
  const absVar=counted.reduce(function(a,x){return a+Math.abs(+x.variance||0);},0);

  const sg=el('div','stats-grid');
  sg.appendChild(statCard('Shifts',all.length,counted.length+' counted',''));
  sg.appendChild(statCard('Times short',shortOnes.length,'',shortOnes.length?'red':'green'));
  sg.appendChild(statCard('Times over',overOnes.length,'',overOnes.length?'amber':'green'));
  /* Net is what the till is actually out by overall; total discrepancy is the
     sum of the absolute gaps, which is the number that matters for spotting a
     cashier whose shorts and overs cancel out on paper. */
  sg.appendChild(statCard('Net variance',fmt(netVar),'across counted shifts',Math.abs(netVar)<0.005?'green':(netVar<0?'red':'amber')));
  sg.appendChild(statCard('Total discrepancy',fmt(absVar),'shorts + overs',absVar>0?'amber':'green'));
  sg.appendChild(statCard('Never counted',uncounted.length,'no cash count',uncounted.length?'red':'green'));
  main.appendChild(sg);

  if(uncounted.length){
    const warn=el('div','card');
    warn.innerHTML='<div class="card-hd">Drawers that were never counted <span>'+uncounted.length+'</span></div>';
    const w=el('div','');
    w.style.cssText='font-size:13px;color:var(--t3);line-height:1.6;margin-bottom:8px';
    w.textContent='These shifts closed without a cash count, so no short or over can be worked out for them. Usually it means the cashier was removed or deactivated mid-shift.';
    warn.appendChild(w);
    uncounted.slice(0,10).forEach(function(x){
      const r=el('div','row');
      r.innerHTML='<div class="row-l"><div class="row-name">'+dashEsc(x.cashier||'—')+'</div>'
        +'<div class="row-sub">'+fd(x.started_at)+' · float '+fmt(x.opening_float)+'</div></div>'
        +'<div class="row-r"><span class="badge b-gray">Not counted</span></div>';
      warn.appendChild(r);
    });
    main.appendChild(warn);
  }

  // Per-cashier roll-up, worst total discrepancy first.
  const byCashier={};
  counted.forEach(function(x){
    const k=x.cashier||'—';
    if(!byCashier[k])byCashier[k]={shifts:0,short:0,over:0,net:0,abs:0,sales:0};
    const b=byCashier[k];
    b.shifts++;b.net+=(+x.variance||0);b.abs+=Math.abs(+x.variance||0);
    b.sales+=(+x.cash_sales||0);
    if((+x.variance||0)<-0.005)b.short++;
    else if((+x.variance||0)>0.005)b.over++;
  });
  const cashierRows=Object.keys(byCashier).map(function(k){return[k,byCashier[k]];})
    .sort(function(a,b){return b[1].abs-a[1].abs;});

  if(cashierRows.length){
    const cc=el('div','card');
    cc.innerHTML='<div class="card-hd">By cashier <span>counted shifts only</span></div>';
    const tbl=el('table','tbl','<thead><tr><th>Cashier</th><th style="text-align:right">Shifts</th>'
      +'<th style="text-align:right">Short</th><th style="text-align:right">Over</th>'
      +'<th style="text-align:right">Net</th><th style="text-align:right">Discrepancy</th></tr></thead>');
    const tb=document.createElement('tbody');
    cashierRows.forEach(function(e){
      const k=e[0],b=e[1];
      const tr=document.createElement('tr');
      const netCol=Math.abs(b.net)<0.005?'var(--t3)':(b.net<0?'var(--dt)':'var(--wt)');
      tr.innerHTML='<td style="font-weight:600">'+dashEsc(k)+'</td>'
        +'<td style="text-align:right">'+b.shifts+'</td>'
        +'<td style="text-align:right;color:'+(b.short?'var(--dt)':'var(--t3)')+'">'+b.short+'</td>'
        +'<td style="text-align:right;color:'+(b.over?'var(--wt)':'var(--t3)')+'">'+b.over+'</td>'
        +'<td style="text-align:right;font-weight:700;color:'+netCol+'">'+fmt(b.net)+'</td>'
        +'<td style="text-align:right;font-weight:700">'+fmt(b.abs)+'</td>';
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);cc.appendChild(tbl);main.appendChild(cc);
  }

  // Full shift list.
  const c=el('div','card');
  const hd=el('div','card-hd');
  hd.innerHTML='Shifts <span>'+all.length+'</span>';
  const expBtn=el('button','add-btn','Export CSV');expBtn.style.marginLeft='auto';
  expBtn.onclick=function(){exportShiftsCSV(all);};
  hd.appendChild(expBtn);c.appendChild(hd);

  const tbl2=el('table','tbl','<thead><tr><th>Cashier</th><th>Started</th><th>Ended</th>'
    +'<th style="text-align:right">Float</th><th style="text-align:right">Cash sales</th>'
    +'<th style="text-align:right">Paid out</th><th style="text-align:right">Expected</th>'
    +'<th style="text-align:right">Counted</th><th style="text-align:right">Short / Over</th></tr></thead>');
  const tb2=document.createElement('tbody');
  all.slice(0,150).forEach(function(x){
    const notCounted=x.counted_cash===null||x.counted_cash===undefined;
    const v=+x.variance||0;
    let badge,vtxt;
    if(notCounted){badge='b-gray';vtxt='Not counted';}
    else if(Math.abs(v)<0.005){badge='b-green';vtxt='Balanced';}
    else if(v<0){badge='b-red';vtxt='Short '+fmt(Math.abs(v));}
    else{badge='b-amber';vtxt='Over '+fmt(v);}
    const tr=document.createElement('tr');
    tr.innerHTML='<td style="font-weight:600">'+dashEsc(x.cashier||'—')+'</td>'
      +'<td style="white-space:nowrap;font-size:12px">'+fd(x.started_at)+' '+ft(x.started_at)+'</td>'
      +'<td style="white-space:nowrap;font-size:12px">'+(x.ended_at?ft(x.ended_at):'—')+'</td>'
      +'<td style="text-align:right">'+fmt(x.opening_float)+'</td>'
      +'<td style="text-align:right">'+fmt(x.cash_sales)+'</td>'
      +'<td style="text-align:right">'+fmt(x.paid_out)+'</td>'
      +'<td style="text-align:right">'+fmt(x.expected_cash)+'</td>'
      +'<td style="text-align:right">'+(notCounted?'—':fmt(x.counted_cash))+'</td>'
      +'<td style="text-align:right"><span class="badge '+badge+'">'+vtxt+'</span></td>';
    tb2.appendChild(tr);
  });
  tbl2.appendChild(tb2);c.appendChild(tbl2);main.appendChild(c);
}

function exportShiftsCSV(rows){
  const head=['Cashier','Started','Ended','Opening float','Cash sales','Paid out','Expected cash','Counted cash','Variance','Note'];
  // Quotes doubled and every field wrapped, so a note containing a comma
  // cannot shift the remaining columns along by one.
  const q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';};
  const lines=[head.map(q).join(',')];
  rows.forEach(function(x){
    lines.push([x.cashier||'',x.started_at||'',x.ended_at||'',
      (+x.opening_float||0).toFixed(2),(+x.cash_sales||0).toFixed(2),
      (+x.paid_out||0).toFixed(2),(+x.expected_cash||0).toFixed(2),
      (x.counted_cash===null||x.counted_cash===undefined)?'NOT COUNTED':(+x.counted_cash).toFixed(2),
      (+x.variance||0).toFixed(2),x.note||''].map(q).join(','));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='shifts-'+new Date().toISOString().slice(0,10)+'.csv';
  a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}

function renderRecipes(main){
  const hRow2=el('div','');hRow2.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px';
  hRow2.appendChild(el('div','page-title','Recipes'));
  const syncRecBtn=el('button','add-btn','⟳ Sync from POS');
  syncRecBtn.onclick=async function(){syncRecBtn.textContent='Syncing...';syncRecBtn.disabled=true;await loadData();syncRecBtn.textContent='⟳ Sync from POS';syncRecBtn.disabled=false;};
  hRow2.appendChild(syncRecBtn);main.appendChild(hRow2);
  const prodWithRecipe=new Set(D.recipes.map(function(r){return r.product_name;})).size;

  // Calculate servings remaining per product (limited by the most constraining ingredient)
  function servingsRemaining(p){
    const recipes=D.recipes.filter(function(r){return r.product_name===p.name;});
    if(!recipes.length)return null;
    let min=Infinity;
    recipes.forEach(function(r){
      const ing=D.ingredients.find(function(i){return i.id===r.ingredient_id;});
      if(ing&&r.qty_used>0){const s=Math.floor(ing.stock/r.qty_used);if(s<min)min=s;}
    });
    return min===Infinity?null:min;
  }

  /* Total servings, counted per INGREDIENT rather than per product.
     The old version summed servingsRemaining() over every product, so one
     tub of 561 iced cups shared by 20 drinks was counted 20 times. Stock
     belongs to the ingredient, not to each product that draws on it: 561
     iced cups plus 59 hot cups plus 6 waffle bases is 626 servings, however
     many menu items sit on top of them.

     Where one ingredient feeds several products at different quantities, the
     smallest quantity is used — that is the most servings it could yield.
     `exact` is false when any product consumes more than one ingredient,
     because then a single serving draws down two stocks at once and the
     capacities can no longer simply be added. Said plainly on the card
     rather than quietly overstated. */
  function ingredientCapacity(){
    const linesByProduct={};
    D.recipes.forEach(function(r){
      (linesByProduct[r.product_name]=linesByProduct[r.product_name]||[]).push(r);
    });
    const anyMultiIngredient=Object.keys(linesByProduct).some(function(k){
      const ids={};linesByProduct[k].forEach(function(r){ids[r.ingredient_id]=1;});
      return Object.keys(ids).length>1;
    });

    const qtysByIngredient={};
    D.recipes.forEach(function(r){
      const q=+r.qty_used;
      if(!(q>0))return;   // a zero-quantity line consumes nothing
      (qtysByIngredient[r.ingredient_id]=qtysByIngredient[r.ingredient_id]||[]).push(q);
    });

    let total=0;const rows=[];
    Object.keys(qtysByIngredient).forEach(function(id){
      const ing=D.ingredients.find(function(i){return String(i.id)===String(id);});
      if(!ing)return;     // recipe points at a deleted ingredient
      const q=Math.min.apply(null,qtysByIngredient[id]);
      const cap=Math.floor((+ing.stock||0)/q);
      total+=cap;
      rows.push({name:ing.name||'—',unit:ing.unit||'',stock:+ing.stock||0,per:q,cap:cap});
    });
    rows.sort(function(a,b){return b.cap-a.cap;});
    return {total:total,rows:rows,exact:!anyMultiIngredient};
  }
  const cap=ingredientCapacity();

  const sg=el('div','stats-grid');
  sg.appendChild(statCard('Products',D.products.length,'total',''));
  sg.appendChild(statCard('With recipes',prodWithRecipe,'linked','blue'));
  sg.appendChild(statCard('Total servings',cap.total.toLocaleString(),
    cap.exact?'across all ingredients':'at most — some items use several ingredients','green'));
  let cannotMake=0;
  D.products.forEach(function(p){if(servingsRemaining(p)===0)cannotMake++;});
  sg.appendChild(statCard('Cannot make',cannotMake,
    cannotMake?'out of an ingredient':'all makeable',cannotMake?'red':'green'));
  sg.appendChild(statCard('No recipe',D.products.length-prodWithRecipe,'need setup','amber'));
  main.appendChild(sg);

  const note=el('div','');note.style.cssText='font-size:13px;color:var(--t2);margin-bottom:16px;padding:12px 14px;background:var(--bg2);border-radius:10px;line-height:1.6';
  note.textContent='Set up ingredients per product here. Each sale deducts these quantities from ingredient stock automatically. Renaming a product moves its recipe lines with it. The servings shown on each product card are what that item alone could make; the total below counts each ingredient once, since several products often share the same stock.';
  main.appendChild(note);

  /* The breakdown behind the Total servings figure. A single total is only
     worth showing if you can see what it is made of — that is what was
     missing when the old number read 12,212. */
  if(cap.rows.length){
    const bd=el('div','card');
    bd.innerHTML='<div class="card-hd"><div style="font-size:14px;font-weight:700">'
      +'Servings by ingredient <span style="font-weight:400;color:var(--t3)">· adds up to '
      +cap.total.toLocaleString()+'</span></div></div>';
    const tbl=el('div','');
    tbl.style.cssText='display:flex;flex-direction:column;gap:2px';
    cap.rows.forEach(function(r){
      const row=el('div','');
      row.style.cssText='display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--b1);font-size:13px';
      row.innerHTML='<div style="flex:1;min-width:0;font-weight:600">'+esc(r.name)+'</div>'
        +'<div style="color:var(--t3);font-size:12px">'+r.stock+' '+esc(r.unit)+' ÷ '+r.per+' per serving</div>'
        +'<div style="font-weight:700;color:'+(r.cap===0?'var(--dt)':r.cap<=20?'var(--wt)':'var(--st)')+';min-width:70px;text-align:right">'
        +r.cap.toLocaleString()+'</div>';
      tbl.appendChild(row);
    });
    bd.appendChild(tbl);
    if(!cap.exact){
      const w=el('div','','Some products use more than one ingredient, so a single serving draws down two stocks at once. The total above is a ceiling, not a promise.');
      w.style.cssText='font-size:12px;color:var(--wt);padding-top:10px;line-height:1.5';
      bd.appendChild(w);
    }
    main.appendChild(bd);
  }

  /* Filter chips. The "No recipe" stat card above tells you how many are
     outstanding; this is how you actually get to them. */
  const hasRecipe=function(p){
    return D.recipes.some(function(r){return r.product_name===p.name;});
  };
  const missingCount=D.products.filter(function(p){return !hasRecipe(p);}).length;
  const fRow=el('div','');
  fRow.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px';
  [['all','All products',D.products.length],
   ['missing','Needs a recipe',missingCount],
   ['has','Has a recipe',D.products.length-missingCount]].forEach(function(o){
    const b=el('button','',o[1]+' ('+o[2]+')');
    const on=UI.recFilter===o[0];
    b.style.cssText='padding:7px 14px;border-radius:16px;font-size:12.5px;font-weight:600;cursor:pointer;'
      +'border:1px solid '+(on?'var(--ac)':'var(--b1)')+';'
      +'background:'+(on?'var(--ac)':'var(--bg2)')+';color:'+(on?'#fff':'var(--t2)')+';font-family:inherit';
    b.onclick=function(){UI.recFilter=o[0];render();};
    fRow.appendChild(b);
  });
  main.appendChild(fRow);

  const shown=D.products.filter(function(p){
    if(UI.recFilter==='missing')return !hasRecipe(p);
    if(UI.recFilter==='has')return hasRecipe(p);
    return true;
  });

  if(!shown.length){
    const none=el('div','card',UI.recFilter==='missing'
      ? 'Every product has a recipe.'
      : UI.recFilter==='has' ? 'No product has a recipe yet.' : 'No products yet.');
    none.style.cssText+=';font-size:13px;color:var(--t2)';
    main.appendChild(none);
    return;
  }

  shown.forEach(function(p){
    const prodRecipes=D.recipes.filter(function(r){return r.product_name===p.name;});
    const servings=servingsRemaining(p);
    const card=el('div','card');
    const hd=el('div','card-hd');

    // Servings badge
    const servBadge=servings!==null?'<span class="badge '+(servings<=5?'b-red':servings<=20?'b-amber':'b-green')+'">'+servings+' servings left</span>':'<span class="badge b-gray">No recipe</span>';
    hd.innerHTML='<div><div style="font-size:15px;font-weight:700">'+esc(p.name)+' '+servBadge+'</div><div style="font-size:12px;color:var(--t3);margin-top:3px">'+esc(p.cat)+' · '+fmt(p.price)+'</div></div>';

    const addIngBtn=addBtn('+ Add ingredient',function(){UI.modal={type:'recipe',product:p,item:null};render();});
    hd.appendChild(addIngBtn);card.appendChild(hd);

    if(!prodRecipes.length){
      const empty=el('div','','No ingredients set — add ingredients to enable auto stock deduction');
      empty.style.cssText='font-size:12px;color:var(--t3);padding:8px 0';
      card.appendChild(empty);
    } else {
      // Cost per serving
      let costPerServing=0;
      prodRecipes.forEach(function(r){
        const ing=D.ingredients.find(function(i){return i.id===r.ingredient_id;});
        if(ing)costPerServing+=r.qty_used*ingCost(ing);
      });
      const margin=p.price-costPerServing;
      const marginPct=p.price>0?Math.round(margin/p.price*100):0;
      const summary=el('div','');
      summary.style.cssText='display:flex;gap:12px;flex-wrap:wrap;padding:8px 0 12px;border-bottom:1px solid var(--b1);margin-bottom:4px';
      summary.innerHTML='<div style="font-size:12px"><span style="color:var(--t3)">Cost/serving: </span><span style="font-weight:700;color:var(--dt)">'+fmt(costPerServing)+'</span></div>'+
        '<div style="font-size:12px"><span style="color:var(--t3)">Gross profit: </span><span style="font-weight:700;color:var(--st)">'+fmt(margin)+'</span></div>'+
        '<div style="font-size:12px"><span style="color:var(--t3)">Margin: </span><span style="font-weight:700;color:'+(marginPct>=50?'var(--st)':marginPct>=25?'var(--wt)':'var(--dt)')+'">'+marginPct+'%</span></div>';
      card.appendChild(summary);

      prodRecipes.forEach(function(r){
        const ing=D.ingredients.find(function(i){return i.id===r.ingredient_id;});
        const sLeft=ing&&r.qty_used>0?Math.floor(ing.stock/r.qty_used):0;
        const row=el('div','row');
        const rl=el('div','row-l');
        rl.innerHTML='<div class="row-name">'+esc(r.ingredient_name)+'</div><div class="row-sub">'+(ing?ing.stock+' '+esc(ing.unit)+' in stock · <span style="color:'+(sLeft<=5?'var(--dt)':sLeft<=20?'var(--wt)':'var(--t3)')+'">'+sLeft+' servings from this ingredient</span>':'Ingredient not found')+'</div>';
        const rr=el('div','row-r');
        const qty=el('span','');qty.style.cssText='font-size:13px;font-weight:700;color:var(--ac);white-space:nowrap';qty.textContent=r.qty_used+' '+(ing?ing.unit:'units')+'/sale';
        const edBtn=el('button','sm-btn','Edit');
        edBtn.onclick=function(){UI.modal={type:'recipe',product:p,item:r};render();};
        const rmBtn=el('button','sm-btn','Remove');rmBtn.style.color='var(--dt)';
        rmBtn.onclick=function(){uiConfirm('Remove this ingredient?',function(__ok){if(!__ok)return;
          /* v7.7.1: was api(...).then(loadData) - the result discarded, so a
             refused delete reloaded the list and the line reappeared with no
             explanation. */
          runWrite('Remove recipe line',function(){return api('/rest/v1/recipes?id=eq.'+r.id,{method:'DELETE'});});
        },{tone:'dang'});};
        rr.appendChild(qty);rr.appendChild(edBtn);rr.appendChild(rmBtn);
        row.appendChild(rl);row.appendChild(rr);card.appendChild(row);
      });
    }
    main.appendChild(card);
  });
  if(!D.products.length)main.appendChild(el('div','empty','No products found — sync products from the POS app first (Admin &rarr; Sync now)'));
}

function renderIngredients(main){
  main.appendChild(el('div','page-title','Ingredients'));

  // Calculations
  const totalCostValue=D.ingredients.reduce(function(a,i){return a+i.stock*ingCost(i);},0);
  const low=D.ingredients.filter(function(i){return i.stock<=ingLow(i);}).length;
  const out=D.ingredients.filter(function(i){return i.stock<=0;}).length;

  // Daily consumption — based on last 7 days sales
  const now=new Date();const week=new Date(now);week.setDate(week.getDate()-7);
  const recentSales=D.sales.filter(function(s){return!s.voided&&new Date(s.date)>=week;});
  const dailyConsumption={};
  recentSales.forEach(function(s){
    (s.items||[]).forEach(function(item){
      const recipes=D.recipes.filter(function(r){return r.product_name===item.name;});
      recipes.forEach(function(r){
        dailyConsumption[r.ingredient_id]=(dailyConsumption[r.ingredient_id]||0)+(r.qty_used*(item.qty||1));
      });
    });
  });
  // Convert to daily avg (divide by 7)
  Object.keys(dailyConsumption).forEach(function(k){dailyConsumption[k]=dailyConsumption[k]/7;});

  // Days of stock remaining per ingredient
  const daysRemaining={};
  D.ingredients.forEach(function(i){
    const daily=dailyConsumption[i.id]||0;
    daysRemaining[i.id]=daily>0?Math.floor(i.stock/daily):null;
  });

  const sg=el('div','stats-grid');
  sg.appendChild(statCard('Ingredients',D.ingredients.length,'',''));
  sg.appendChild(statCard('Total cost value',fmt(totalCostValue),'in stock','blue'));
  sg.appendChild(statCard('Low stock',low,'need restocking',low>0?'red':'green'));
  sg.appendChild(statCard('Out of stock',out,'',out>0?'red':''));
  main.appendChild(sg);

  // Cost summary card
  const costCard=el('div','card');
  costCard.innerHTML='<div class="card-hd">Cost breakdown</div>';
  const costRows=[
    ['Total ingredient value',fmt(totalCostValue),''],
    ['Average cost per ingredient',D.ingredients.length?fmt(totalCostValue/D.ingredients.length):'PHP 0.00',''],
    ['Most expensive ingredient',(function(){const s=D.ingredients.slice().sort(function(a,b){return b.stock*ingCost(b)-a.stock*ingCost(a);});return s[0]?s[0].name+' ('+fmt(s[0].stock*ingCost(s[0]))+')':'None';})(),''],
  ];
  costRows.forEach(function(row){
    const r=el('div','payslip-row');
    r.innerHTML='<span>'+row[0]+'</span><span style="font-weight:600;color:var(--ac)">'+row[1]+'</span>';
    costCard.appendChild(r);
  });
  main.appendChild(costCard);

  // Stock list with days remaining
  const c=el('div','card');
  const hd=el('div','card-hd','Ingredient stock');hd.appendChild(addBtn('+ Add ingredient',function(){UI.modal={type:'ingredient',item:null};render();}));c.appendChild(hd);
  D.ingredients.sort(function(a,b){return a.stock-b.stock;}).forEach(function(ing){
    const isLow=ing.stock<=ingLow(ing);
    const days=daysRemaining[ing.id];
    const dailyUse=dailyConsumption[ing.id]||0;
    const r=el('div','row');
    const rl=el('div','row-l');
    let sub=ing.unit+' · PHP '+ingCost(ing)+'/unit · Value: '+fmt(ing.stock*ingCost(ing));
    if(dailyUse>0)sub+='<br><span style="color:'+(days&&days<=3?'var(--dt)':days&&days<=7?'var(--wt)':'var(--st)')+'">~'+dailyUse.toFixed(1)+ing.unit+'/day · '+(days!==null?days+' days left':'unlimited')+'</span>';
    else sub+='<br><span style="color:var(--t3)">No sales data yet</span>';
    rl.innerHTML='<div class="row-name">'+esc(ing.name)+'</div><div class="row-sub" style="line-height:1.6">'+sub+'</div>';
    const rr=el('div','row-r');
    const badge=el('span','badge '+(isLow?'b-amber':'b-green'),ing.stock+' '+(isLow?'⚠ low':'OK'));
    const editBtn=el('button','sm-btn','Edit');
    const ingId=ing.id;
    editBtn.onclick=function(){
      const found=D.ingredients.find(function(x){return x.id===ingId;});
      if(found){UI.modal={type:'ingredient',item:found};render();}
    };
    rr.appendChild(badge);rr.appendChild(editBtn);
    r.appendChild(rl);r.appendChild(rr);c.appendChild(r);
  });
  if(!D.ingredients.length)c.appendChild(el('div','empty','No ingredients yet'));
  main.appendChild(c);

  // Weekly consumption forecast
  if(Object.keys(dailyConsumption).length>0){
    const fc=el('div','card');
    fc.innerHTML='<div class="card-hd">Weekly consumption forecast <span>based on last 7 days</span></div>';
    D.ingredients.forEach(function(ing){
      const daily=dailyConsumption[ing.id]||0;
      if(!daily)return;
      const weekly=daily*7;const days=daysRemaining[ing.id];
      const pct=Math.min(ing.stock/Math.max(weekly,1)*100,100);
      const r=el('div','');r.style.cssText='padding:10px 0;border-bottom:1px solid var(--b1)';
      r.innerHTML='<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:13px;font-weight:600">'+esc(ing.name)+'</span><span style="font-size:12px;color:var(--t3)">'+weekly.toFixed(0)+esc(ing.unit)+'/week used</span></div>'+
        '<div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+(pct<20?'var(--dt)':pct<50?'var(--wt)':'var(--ac)')+';border-radius:3px;transition:width .4s"></div></div>'+
        '<div style="display:flex;justify-content:space-between;margin-top:4px"><span style="font-size:11px;color:var(--t3)">'+ing.stock+ing.unit+' remaining</span><span style="font-size:11px;color:'+(days&&days<=7?'var(--dt)':'var(--t3)')+'">'+(days!==null?days+' days left':'No usage data')+'</span></div>';
      fc.appendChild(r);
    });
    main.appendChild(fc);
  }
}

function exportOrdersCSV(rows){
  const head=['Queue','Time','Type','Items','Total','Status','Cashier'];
  const esc2=function(v){return '"'+String(v==null?'':v).split('"').join('""')+'"';};
  const lines=[head.join(',')];
  rows.forEach(function(s){
    lines.push([
      s.queue_no==null?'':s.queue_no,
      new Date(s.date).toLocaleString(),
      ordTypeLabel(s.order_type),
      (s.items||[]).map(function(i){return (i.name||'')+(i.qty>1?' x'+i.qty:'');}).join('; '),
      (+s.total||0).toFixed(2),
      ordStatusOf(s),
      s.cashier||''
    ].map(esc2).join(','));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='orders-'+UI.ordDate+'.csv';
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}

/* Local calendar-day key, matching how the board groups a trading day. */
function todayKey(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
        +'-'+String(d.getDate()).padStart(2,'0');
}
function dayKeyOf(iso){
  try{
    const d=new Date(iso);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
          +'-'+String(d.getDate()).padStart(2,'0');
  }catch(e){return '';}
}

function renderPnL(main,fs,fe,rev,exp,net,P){
  main.appendChild(el('div','page-title','Profit & Loss'));
  main.appendChild(filterBar());

  /* Every figure now comes from the one shared calculation, so this page
     cannot disagree with Overview and Reports. netProfit was rev-exp here,
     leaving out cost of goods entirely; wastage was all-time even when the
     statement was labelled "this week"; and salary was a raw monthly total
     regardless of the period selected. */
  const cogs=P.cogs;
  const vat=P.vat;
  const netSales=P.netSales;
  const salaryExp=P.labor;
  const wasteCost=P.waste;
  const totalCogs=P.totalCogs;
  const grossProfit=P.grossProfit;
  const totalOpex=P.totalOpex;
  const netProfit=P.netProfit;
  const grossMargin=P.grossMargin;
  const netMargin=P.netMargin;

  // Summary stats
  const sg=el('div','stats-grid');
  sg.appendChild(statCard('Gross profit',fmt(grossProfit),grossMargin+'% margin',grossProfit>=0?'green':'red'));
  sg.appendChild(statCard('Net profit',fmt(netProfit),netMargin+'% margin',netProfit>=0?'green':'red'));
  sg.appendChild(statCard('COGS',fmt(cogs),'ingredient costs','red'));
  sg.appendChild(statCard('Wastage cost',fmt(wasteCost),'losses','amber'));
  main.appendChild(sg);

  // Full P&L statement
  const pl=el('div','card');
  pl.innerHTML='<div class="card-hd">Profit & Loss Statement <span>'+UI.filter+'</span></div>';

  function plSection(title){
    const h=el('div','');h.style.cssText='font-size:10px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:1px;padding:14px 0 6px;border-bottom:1px solid var(--b2);margin-top:4px';
    h.textContent=title;pl.appendChild(h);
  }
  function plRow(label,value,color,bold,indent){
    const r=el('div','');
    r.style.cssText='display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b1)';
    r.innerHTML='<span style="font-size:13px;color:'+(color||'var(--t2)')+';font-weight:'+(bold?'700':'400')+';padding-left:'+(indent?'16px':'0')+'">'+label+'</span>'+
      '<span style="font-size:13px;font-weight:'+(bold?'800':'600')+';color:'+(color||'var(--t2)')+'">'+value+'</span>';
    pl.appendChild(r);
  }
  function plTotal(label,value,color){
    const r=el('div','');
    r.style.cssText='display:flex;justify-content:space-between;padding:12px 0;margin-top:2px;border-top:2px solid var(--b2)';
    r.innerHTML='<span style="font-size:15px;font-weight:800;color:'+(color||'var(--t1)')+'">'+label+'</span>'+
      '<span style="font-size:16px;font-weight:900;color:'+(color||'var(--t1)')+'">'+value+'</span>';
    pl.appendChild(r);
  }

  plSection('Revenue');
  plRow('Gross sales',fmt(rev),'var(--t1)',true);
  /* VAT is collected on the shop's behalf and remitted, so it is not a cost
     of trading and is not subtracted below. It used to be printed as though
     it were, directly above a gross profit figure computed off gross sales,
     which made the statement impossible to follow with a calculator.
     Both lines stay - they are needed for filing - but they are now marked
     as reference so the waterfall reads straight down. */
  plRow('VAT (12%) — for reference, not deducted',fmt(vat),'var(--t3)',false,true);
  plRow('Net sales (excl. VAT) — for reference',fmt(netSales),'var(--t3)',false,true);

  plSection('Cost of Goods Sold');
  plRow('Ingredient costs',fmt(cogs),'var(--t2)',false);
  plRow('Wastage / spoilage',fmt(wasteCost),'var(--wt)',false);
  plTotal('Gross Profit',fmt(grossProfit),grossProfit>=0?'var(--st)':'var(--dt)');
  const r1=el('div','');r1.style.cssText='font-size:11px;color:var(--t3);padding:4px 0 8px;text-align:right';r1.textContent='Gross margin: '+grossMargin+'%';pl.appendChild(r1);

  plSection('Operating Expenses');
  // Break down expenses by category
  const expByCat={};
  fe.forEach(function(e){expByCat[e.cat||'Other']=(expByCat[e.cat||'Other']||0)+e.amount;});
  Object.entries(expByCat).forEach(function(entry){plRow(entry[0],fmt(entry[1]),'var(--t2)',false,true);});
  if(salaryExp>0)plRow('Labour — all pay types, prorated to '+UI.filter,fmt(salaryExp),'var(--t2)',false,true);
  plRow('Total operating expenses',fmt(exp+salaryExp),'var(--t2)',true);
  plTotal('Net Profit',fmt(netProfit),netProfit>=0?'var(--st)':'var(--dt)');
  const r2=el('div','');r2.style.cssText='font-size:11px;color:var(--t3);padding:4px 0 8px;text-align:right';r2.textContent='Net margin: '+netMargin+'%';pl.appendChild(r2);

  main.appendChild(pl);

  // Per product profitability
  const prodCard=el('div','card');
  prodCard.innerHTML='<div class="card-hd">Per product profitability</div>';
  const prodProfit=[];
  D.products.forEach(function(p){
    const recipes=D.recipes.filter(function(r){return r.product_name===p.name;});
    let cogs2=0;
    recipes.forEach(function(r){
      const ing=D.ingredients.find(function(i){return i.id===r.ingredient_id;});
      if(ing)cogs2+=r.qty_used*ingCost(ing);
    });
    /* Revenue is taken from what each line ACTUALLY rang up, not the
       product's current price - repricing an item used to rewrite the profit
       on every past sale of it. And a discount is recorded once on the
       transaction, so summing raw line prices overstated per-product profit
       on every discounted sale. Spread it across the lines by value. */
    let sold=0,lineRev=0;
    fs.filter(function(s){return!s.voided;}).forEach(function(s){
      const items=s.items||[];
      let gross=0;
      items.forEach(function(i){
        gross+=(i.price!=null?Number(i.price):0)*(i.qty!=null?Number(i.qty):1);
      });
      const disc=+s.discount||+s.disc||0;
      const factor=(gross>0&&disc>0)?Math.max(0,(gross-disc)/gross):1;
      items.forEach(function(i){
        if(i.name!==p.name)return;
        const q=i.qty!=null?Number(i.qty):1;
        sold+=q;
        lineRev+=(i.price!=null?Number(i.price):Number(p.price)||0)*q*factor;
      });
    });
    if(sold>0){
      const avg=lineRev/sold;
      prodProfit.push({name:p.name,price:avg,cogs:cogs2,
        margin:avg>0?Math.round((avg-cogs2)/avg*100):0,
        sold:sold,totalProfit:lineRev-cogs2*sold});
    }
  });
  prodProfit.sort(function(a,b){return b.totalProfit-a.totalProfit;});
  if(!prodProfit.length){
    prodCard.appendChild(el('div','empty','No sales data yet — set up recipes to see per-product profit'));
  } else {
    prodProfit.forEach(function(p,i){
      const r=el('div','row');
      const rl=el('div','row-l');
      rl.innerHTML='<div class="row-name">'+(i+1)+'. '+esc(p.name)+'</div><div class="row-sub">Sold: '+p.sold+' · Cost/unit: '+fmt(p.cogs)+'</div>';
      const rr=el('div','row-r');
      rr.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:3px';
      rr.innerHTML='<span style="font-weight:700;color:var(--st)">'+fmt(p.totalProfit)+'</span>'+
        '<span class="badge '+(p.margin>=50?'b-green':p.margin>=25?'b-amber':'b-red')+'">'+p.margin+'% margin</span>';
      r.appendChild(rl);r.appendChild(rr);prodCard.appendChild(r);
    });
  }
  main.appendChild(prodCard);
}
